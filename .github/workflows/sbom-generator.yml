name: SBOM Generation and Evidence

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]  # Автоматически для тегов (релизов)
  workflow_dispatch:  # Ручной запуск
    inputs:
      image_tag:
        description: 'Docker image tag for SBOM'
        required: true
        default: 'latest'

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полный history для точного SBOM

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate SBOM with Syft (фиксированная версия)
        uses: anchore/sbom-action@v0.15.1  # Фиксированная версия!
        id: syft
        with:
          image: "ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag || github.ref_name }}"
          format: "spdx-json"
          output-file: "EVIDENCE/P09/sbom-${{ github.sha }}.json"

      - name: Validate SBOM structure
        run: |
          echo "Validating SBOM file..."
          if [ -f "EVIDENCE/P09/sbom-${{ github.sha }}.json" ]; then
            echo "✓ SBOM file exists"
            # Простая проверка JSON
            jq empty "EVIDENCE/P09/sbom-${{ github.sha }}.json" && echo "✓ Valid JSON"
          else
            echo "✗ SBOM file not found!"
            exit 1
          fi

      - name: Create evidence summary
        run: |
          echo "# SBOM Evidence Report" > EVIDENCE/P09/evidence-report.md
          echo "## Generation Details" >> EVIDENCE/P09/evidence-report.md
          echo "- **Commit SHA:** ${{ github.sha }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **Generated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P09/evidence-report.md
          echo "- **Tool:** Syft v$(docker run --rm anchore/syft:v0.102.1 version | grep Version | cut -d' ' -f2)" >> EVIDENCE/P09/evidence-report.md

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-evidence-${{ github.sha }}
          path: |
            EVIDENCE/P09/sbom-${{ github.sha }}.json
            EVIDENCE/P09/evidence-report.md
          retention-days: 90  # Храним 90 дней

      - name: Attach SBOM to Release (только для тегов)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            EVIDENCE/P09/sbom-${{ github.sha }}.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit evidence to repository
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add EVIDENCE/
          git commit -m "chore: update SBOM evidence for ${{ github.sha }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Nothing to push"
