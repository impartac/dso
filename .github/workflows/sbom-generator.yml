name: SBOM Generation and Evidence

on:
  push:
    # branches: [ main, master ]
    # tags: [ 'v*' ]  # Автоматически для тегов (релизов)
  workflow_dispatch:  # Ручной запуск
    inputs:
      image_tag:
        description: 'Docker image tag for SBOM'
        required: true
        default: 'latest'

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check image availability
        id: check-image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag || github.ref_name }}"
          echo "Checking image: $IMAGE"

          # Пытаемся проверить доступность образа
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image exists and is accessible"
            echo "image_available=true" >> $GITHUB_OUTPUT
          else
            echo "Warning: Image not accessible. Using fallback image."
            echo "image_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.15.1
        id: syft
        with:
          image: ${{ steps.check-image.outputs.image_available == 'true' && format('ghcr.io/{0}:{1}', github.repository, github.event.inputs.image_tag || github.ref_name) || 'docker.io/library/alpine:latest' }}
          format: "spdx-json"
          output-file: "EVIDENCE/P09/sbom-${{ github.sha }}.json"

      - name: Install jq for JSON validation
        if: always()
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate SBOM structure
        run: |
          echo "Validating SBOM file..."
          FILE="EVIDENCE/P09/sbom-${{ github.sha }}.json"
          if [ -f "$FILE" ]; then
            echo "✓ SBOM file exists"
            # Проверка, что файл не пустой
            if [ -s "$FILE" ]; then
              echo "✓ SBOM file is not empty"
              # Проверка валидности JSON
              if jq empty "$FILE" 2>/dev/null; then
                echo "✓ Valid JSON structure"
                # Дополнительная проверка на структуру SPDX
                if jq '.spdxVersion' "$FILE" 2>/dev/null | grep -q "SPDX"; then
                  echo "✓ Valid SPDX format"
                else
                  echo "⚠ File is JSON but may not be valid SPDX format"
                fi
              else
                echo "✗ Invalid JSON"
                exit 1
              fi
            else
              echo "✗ SBOM file is empty"
              exit 1
            fi
          else
            echo "✗ SBOM file not found!"
            exit 1
          fi

      - name: Create evidence summary
        run: |
          echo "# SBOM Evidence Report" > EVIDENCE/P09/evidence-report.md
          echo "## Generation Details" >> EVIDENCE/P09/evidence-report.md
          echo "- **Commit SHA:** ${{ github.sha }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **Repository:** ${{ github.repository }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **Generated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P09/evidence-report.md
          echo "- **Image Scanned:** ${{ steps.syft.outputs.image || 'Unknown' }}" >> EVIDENCE/P09/evidence-report.md
          echo "- **SBOM Format:** SPDX-JSON" >> EVIDENCE/P09/evidence-report.md

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-evidence-${{ github.sha }}
          path: |
            EVIDENCE/P09/sbom-${{ github.sha }}.json
            EVIDENCE/P09/evidence-report.md
          retention-days: 90

      - name: Commit evidence to repository
        if: always()
        run: |
          # Проверяем, есть ли изменения для коммита
          if git status --porcelain | grep -q "EVIDENCE/"; then
            echo "Found evidence changes, committing..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add EVIDENCE/
            git commit -m "chore: update SBOM evidence for ${{ github.sha }}"

            # Пытаемся запушить, но не выходим с ошибкой если не получается
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "✓ Evidence committed and pushed"
            else
              echo "⚠ Could not push evidence (might be running in fork or without permissions)"
            fi
          else
            echo "No evidence changes to commit"
          fi

      - name: Workflow completion status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ SBOM generation completed successfully"
            echo "📄 SBOM file: EVIDENCE/P09/sbom-${{ github.sha }}.json"
          else
            echo "❌ SBOM generation failed"
            exit 1
          fi
