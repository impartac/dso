name: Security Scan (SBOM + SCA)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: true
        default: 'full'
        type: choice
        options:
          - sbom-only
          - sca-only
          - full

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || inputs.scan_type != 'sca-only'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.15.1
        id: syft
        with:
          image: "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${GITHUB_SHA:0:8}"
          format: "spdx-json"
          output-file: "EVIDENCE/P09/sbom-${{ github.sha }}.json"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: EVIDENCE/P09/sbom-${{ github.sha }}.json

  sca-analysis:
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: github.event_name == 'workflow_dispatch' || inputs.scan_type != 'sbom-only'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: EVIDENCE/P09/

      - name: Run Grype SCA scan (фиксированная версия)
        uses: anchore/scan-action@v3
        id: grype
        with:
          path: "EVIDENCE/P09/sbom-${{ github.sha }}.json"
          fail-build: false
          severity-cutoff: "low"

      - name: Generate SCA summary report
        run: |
          echo "# 📋 SCA Security Report" > EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          echo "## 📊 Executive Summary" >> EVIDENCE/P09/sca_summary.md
          echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> EVIDENCE/P09/sca_summary.md
          echo "**Commit SHA:** ${{ github.sha }}" >> EVIDENCE/P09/sca_summary.md
          echo "**Scan Tool:** Grype $(docker run --rm anchore/grype:latest version | grep Version)" >> EVIDENCE/P09/sca_summary.md
          echo "**Workflow Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          # Извлекаем статистику из отчета
          if [ -f "EVIDENCE/P09/sca_report.json" ]; then
            CRITICAL=$(jq '.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id' EVIDENCE/P09/sca_report.json | sort -u | wc -l)
            HIGH=$(jq '.matches[] | select(.vulnerability.severity == "High") | .vulnerability.id' EVIDENCE/P09/sca_report.json | sort -u | wc -l)
            MEDIUM=$(jq '.matches[] | select(.vulnerability.severity == "Medium") | .vulnerability.id' EVIDENCE/P09/sca_report.json | sort -u | wc -l)
            LOW=$(jq '.matches[] | select(.vulnerability.severity == "Low") | .vulnerability.id' EVIDENCE/P09/sca_report.json | sort -u | wc -l)

            echo "## 🚨 Vulnerability Summary" >> EVIDENCE/P09/sca_summary.md
            echo "| Severity | Count |" >> EVIDENCE/P09/sca_summary.md
            echo "|----------|-------|" >> EVIDENCE/P09/sca_summary.md
            echo "| 🔴 Critical | $CRITICAL |" >> EVIDENCE/P09/sca_summary.md
            echo "| 🟠 High | $HIGH |" >> EVIDENCE/P09/sca_summary.md
            echo "| 🟡 Medium | $MEDIUM |" >> EVIDENCE/P09/sca_report.json | sort -u | wc -l)" >> EVIDENCE/P09/sca_summary.md
            echo "| 🟢 Low | $LOW |" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md

            # Ключевые находки (Critical/High)
            echo "## 🔍 Key Findings (Critical/High)" >> EVIDENCE/P09/sca_summary.md
            if [ $((CRITICAL + HIGH)) -gt 0 ]; then
              jq -r '.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High") | "### \(.vulnerability.id)\n- **Package:** \(.artifact.name)@\(.artifact.version)\n- **Severity:** \(.vulnerability.severity)\n- **Fix Version:** \(.vulnerability.fix.versions[0] // "No fix available")\n- **Description:** \(.vulnerability.description[0:200])\n"' EVIDENCE/P09/sca_report.json >> EVIDENCE/P09/sca_summary.md
            else
              echo "✅ No Critical or High severity vulnerabilities found." >> EVIDENCE/P09/sca_summary.md
            fi
            echo "" >> EVIDENCE/P09/sca_summary.md

            # План действий
            echo "## 🎯 Action Plan" >> EVIDENCE/P09/sca_summary.md
            if [ $CRITICAL -gt 0 ]; then
              echo "### 🔴 Immediate Actions (Critical)" >> EVIDENCE/P09/sca_summary.md
              echo "1. Review and patch Critical vulnerabilities within 24 hours" >> EVIDENCE/P09/sca_summary.md
              echo "2. Consider temporary workarounds if patches are not available" >> EVIDENCE/P09/sca_summary.md
            fi

            if [ $HIGH -gt 0 ]; then
              echo "### 🟠 High Priority Actions" >> EVIDENCE/P09/sca_summary.md
              echo "1. Schedule updates for High severity issues within 7 days" >> EVIDENCE/P09/sca_summary.md
              echo "2. Evaluate exploitability and business impact" >> EVIDENCE/P09/sca_summary.md
            fi

            echo "### 📋 General Recommendations" >> EVIDENCE/P09/sca_summary.md
            echo "1. Update dependencies to latest secure versions" >> EVIDENCE/P09/sca_summary.md
            echo "2. Review false positives in `.github/grype-config.yaml`" >> EVIDENCE/P09/sca_summary.md
            echo "3. Monitor for new vulnerabilities via Dependabot" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md

            echo "## 📈 Historical Comparison" >> EVIDENCE/P09/sca_summary.md
            echo "| Metric | Previous Scan | Current Scan | Change |" >> EVIDENCE/P09/sca_summary.md
            echo "|--------|---------------|--------------|--------|" >> EVIDENCE/P09/sca_summary.md
            echo "| Total Vulnerabilities | N/A | $((CRITICAL + HIGH + MEDIUM + LOW)) | — |" >> EVIDENCE/P09/sca_summary.md
            echo "| Critical | N/A | $CRITICAL | — |" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md

          else
            echo "⚠️ SCA report not generated" >> EVIDENCE/P09/sca_summary.md
          fi

          echo "## 📝 Notes" >> EVIDENCE/P09/sca_summary.md
          echo "- This report is automatically generated" >> EVIDENCE/P09/sca_summary.md
          echo "- For detailed information, review the full JSON report" >> EVIDENCE/P09/sca_summary.md
          echo "- False positives can be configured in `.github/grype-config.yaml`" >> EVIDENCE/P09/sca_summary.md

      - name: Comment on PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('EVIDENCE/P09/sca_summary.md', 'utf8');

            // Извлекаем только ключевую информацию для PR
            const lines = summary.split('\n');
            let prComment = '## 🔍 SCA Security Scan Results\n\n';

            // Находим Vulnerability Summary
            let inSummary = false;
            let summaryLines = [];
            for (const line of lines) {
              if (line.includes('## 🚨 Vulnerability Summary')) {
                inSummary = true;
                continue;
              }
              if (inSummary && line.includes('## 🔍 Key Findings')) {
                break;
              }
              if (inSummary) {
                summaryLines.push(line);
              }
            }

            prComment += summaryLines.join('\n') + '\n\n';

            // Добавляем Key Findings если есть
            const criticalHigh = summary.match(/## 🔍 Key Findings.*?✅ No Critical or High/gis);
            if (criticalHigh && !criticalHigh[0].includes('✅ No Critical')) {
              prComment += '**Key findings require attention.** Review the full report for details.\n\n';
            } else {
              prComment += '✅ No Critical or High severity vulnerabilities detected.\n\n';
            }

            prComment += `[View Full Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: prComment
            });

      - name: Upload SCA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports-${{ github.sha }}
          path: |
            EVIDENCE/P09/sca_report.json
            EVIDENCE/P09/sca_summary.md
          retention-days: 90

      - name: Create security badge
        run: |
          # Простая логика для бейджа
          if [ -f "EVIDENCE/P09/sca_report.json" ]; then
            CRITICAL=$(jq '.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id' EVIDENCE/P09/sca_report.json | sort -u | wc -l)
            if [ $CRITICAL -gt 0 ]; then
              echo "SECURITY_STATUS=critical" >> $GITHUB_ENV
            else
              echo "SECURITY_STATUS=passing" >> $GITHUB_ENV
            fi
          else
            echo "SECURITY_STATUS=unknown" >> $GITHUB_ENV
          fi
