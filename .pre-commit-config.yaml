# .pre-commit-config.yaml
# Конфигурация pre-commit хуков для автоматической проверки кода
# Установка: pip install pre-commit && pre-commit install

repos:
  # ========== БАЗОВЫЕ ХУКИ ==========
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Фиксируем версию для воспроизводимости
    hooks:
      # Форматирование и чистка файлов
      - id: end-of-file-fixer  # Добавляет пустую строку в конец файлов (стандарт POSIX)
      - id: trailing-whitespace  # Удаляет пробелы в конце строк (улучшает diff)
      - id: check-merge-conflict  # Предотвращает коммит файлов с конфликтами слияния
      - id: mixed-line-ending  # Приводит переносы строк к единому формату (LF для Unix)
        args: ["--fix=lf"]  # Явно указываем формат переноса строк
      - id: detect-private-key  # Обнаружение приватных ключей
      - id: check-added-large-files  # Проверка размера файлов
        args: ['--maxkb=5120']  # Максимум 5MB (можно настроить)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # ========== ФОРМАТИРОВАНИЕ PYTHON ==========
  - repo: https://github.com/psf/black
    rev: 24.8.0  # Black с стабильным API
    hooks:
      - id: black
        # Можно добавить дополнительные настройки:
        # args: ["--line-length=88", "--target-version=py311"]

  # ========== СОРТИРОВКА ИМПОРТОВ ==========

  # ========== ЛИНТИНГ И АНАЛИЗ КОДА ==========
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]  # Автоматически исправляет ошибки
        # Можно расширить функциональность:
        # args: ["--fix", "--select", "E,W,F", "--ignore", "E501"]

  # ========== ДОПОЛНИТЕЛЬНЫЕ ХУКИ (рекомендуемые) ==========

  # Проверка безопасности зависимостей
  # - repo: https://github.com/pyupio/safety
  #   rev: 2.3.5
  #   hooks:
  #     - id: safety
  #       args: ["check", "--full-report"]

  # Проверка типов MyPy (опционально, может быть медленным)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.10.0
  #   hooks:
  #     - id: mypy
  #       args: ["--ignore-missing-imports", "--strict"]

  # Проверка на уязвимые зависимости (pip-audit)
  # - repo: https://github.com/pypa/pip-audit
  #   rev: v2.6.1
  #   hooks:
  #     - id: pip-audit
  #       args: ["-r", "requirements.txt"]

  # Проверка сложности кода (radon)
  # - repo: https://github.com/rubik/radon
  #   rev: "5.1.0"
  #   hooks:
  #     - id: radon
  #       args: ["cc", "--min", "C", "--show-complexity"]

  # Проверка на "мусорный" код (vulture)
  # - repo: https://github.com/jendrikseipp/vulture
  #   rev: v2.11
  #   hooks:
  #     - id: vulture
  #     - args: ["app", "tests"]

  # Проверка секретов в коде (git-secrets)
  # - repo: https://github.com/awslabs/git-secrets
  #   rev: "1.3.0"
  #   hooks:
  #     - id: git-secrets

# ========== НАСТРОЙКИ ВЫПОЛНЕНИЯ ==========
default_language_version:  # Явно указываем версии языков
  python: python3.12

# Отключаем хуки для определенных файлов/папок
exclude: |
  (?x)^(
    .*\.min\.js|          # Минифицированные JS файлы
    .*\.min\.css|         # Минифицированные CSS файлы
    .*\.map|              # Source maps
    .*\.svg|              # SVG файлы
    .*\.ico|              # Иконки
    ^\.git/|              # Git директория
    ^\.venv/|             # Виртуальное окружение
    ^node_modules/|       # Node модули
    ^migrations/|         # Миграции БД
    ^\.pytest_cache/|     # Кэш pytest
    ^__pycache__/|        # Кэш Python
    ^\.tox/|              # Tox директория
    ^build/|              # Сборки
    ^dist/|               # Дистрибутивы
    \.pyc$                # Байткод Python
  )$

# Настройки для определенных файлов
files: \.(py|js|ts|json|yaml|yml|md|txt)$  # Какие файлы проверять

# # Настройки пропуска
# skip: []  # Список хуков для пропуска (например, ["black"])

# # Автоматическое обновление хуков
# autoupdate: true  # Автоматически обновлять хуки при pre-commit autoupdate

# # Требовать явного подтверждения для определенных хуков
# require_serial: false  # Запускать хуки параллельно

# Настройки кэширования
ci:
  autofix_commit_msg: "style: auto-fix by pre-commit"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
