[tool.ruff]
line-length = 100
lint.select = ["E","F","W"]
target-version = "py312"
exclude = ["venv",".venv","build","dist"]

[tool.isort]
profile = "black"
line_length = 88  
multi_line_output = 3
include_trailing_comma = true

[tool.ruff.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v -s --tb=short --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dso"  # Обязательное поле
version = "1.0.0"  # Обязательное поле - любые цифры, можно взять из git tag
description = "DSO project"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    # Перечислите зависимости из requirements.txt
    # "fastapi>=0.104.0",
    # "sqlalchemy>=2.0.0",
]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
# Автоматически ищет пакеты в текущей директории
where = ["."]
# Явно указываем, какие пакеты включать
include = ["app*", "db*"]
# Исключаем непакетные директории
exclude = [
    "tests*", 
    "test*", 
    "docs*", 
    "*tests*",
    "policy*",
    "EVIDENCE*",
    "dist*",
    "build*",
    "*.egg-info*"
]
